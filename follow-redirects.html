<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Redirect Resolver</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #111827;
            background-color: white;
            line-height: 1.5;
        }
        .container {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
        }
        h1 {
            margin-top: 0;
        }
        label, .url-label {
            font-weight: 600;
        }
        input {
            display: block;
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: 1px solid #9ca3af;
            border-radius: 0.375rem;
            font: inherit;
            background-color: white;
            color: inherit;
        }
        .hint {
            color: #4b5563;
            font-size: 0.875rem;
        }
        .actions, .url-label {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .actions {
            margin-top: 1rem;
        }
        button {
            background-color: #2563eb;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font: inherit;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        button.secondary {
            background-color: #4b5563;
        }
        :focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 3px;
        }
        a {
            color: #1d4ed8;
            overflow-wrap: anywhere;
        }
        #status {
            margin-bottom: 0;
        }
        .error, .rate-limit-info, .url-box {
            border-radius: 0.375rem;
            padding: 0.75rem;
            margin-top: 1rem;
        }
        .error {
            color: #991b1b;
            background-color: #fee2e2;
            overflow-wrap: anywhere;
        }
        .rate-limit-info {
            background-color: #f3f4f6;
            font-size: 0.875rem;
        }
        .rate-limit-info.warning {
            background-color: #fff7ed;
            color: #9a3412;
        }
        .rate-limit-info.error {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .url-box {
            background-color: white;
            border: 1px solid #d1d5db;
        }
        .destination {
            background-color: #eff6ff;
            border-color: #93c5fd;
        }
        .cleaned-url {
            background-color: #f0fdf4;
            border-color: #86efac;
        }
        .url-label {
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        .copy-button {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        .redirect-chain {
            padding-left: 1.5rem;
        }
        .redirect-chain li {
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            margin-bottom: 0.75rem;
            border-radius: 0.375rem;
            background-color: white;
        }
        .redirect-chain .url-box {
            margin-top: 0.75rem;
        }
        [hidden] {
            display: none !important;
        }
        @media (max-width: 480px) {
            body {
                margin: 1rem auto;
            }
            .container {
                padding: 1rem;
            }
            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>URL Redirect Resolver</h1>
        <p>Follow HTTP redirects to find a URL's final destination.</p>

        <div id="rateLimitInfo" class="rate-limit-info" hidden>
            Requests remaining: <span id="requestsRemaining">-</span>
            <span id="resetTimer" hidden>
                (Resets in <span class="countdown">-</span>s)
            </span>
        </div>

        <form id="resolveForm" novalidate>
            <label for="urlInput">URL to resolve</label>
            <input id="urlInput" type="url" placeholder="https://example.com" required
                autocomplete="off" spellcheck="false" aria-describedby="urlHint privacyHint">
            <p id="urlHint" class="hint">Include http:// or https://. Press Enter to resolve the URL.</p>
            <p id="privacyHint" class="hint">This tool sends the URL to a remote resolver. Do not submit private links or access tokens.</p>
            <div class="actions">
                <button id="resolveButton" type="submit">Resolve URL</button>
                <button id="cancelButton" type="button" class="secondary" hidden>Cancel</button>
            </div>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="result"></div>
        <section id="chainSection" aria-labelledby="chainHeading" hidden>
            <h2 id="chainHeading">Redirect chain</h2>
            <ol id="redirectChain" class="redirect-chain"></ol>
        </section>
    </main>

    <script>
        let urlInput, resolveButton, cancelButton, result, statusMessage, redirectChain,
            chainSection, rateLimitInfo, requestsRemaining, resetTimer, countdown, countdownInterval;
        let activeController = null;

        const WORKER_URL = 'https://follow-redirects.billowing-moon-690d.workers.dev';
        const REQUEST_TIMEOUT_MS = 20000;
        const TRACKING_PARAMS = new Set([
            'fbclid', 'gclid', 'dclid', 'gbraid', 'wbraid', 'igshid', 'msclkid',
            '_hsenc', '_hsmi', 'mc_cid', 'mc_eid', '_openstat', 'wickedid', 'yclid'
        ]);

        function parseHttpUrl(value) {
            if (typeof value !== 'string' || !/^https?:\/\//i.test(value.trim())) {
                throw new Error('Enter a valid URL that starts with http:// or https://.');
            }
            const parsed = new URL(value);
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                throw new Error('Enter a valid URL that starts with http:// or https://.');
            }
            return parsed;
        }

        function cleanUrl(url) {
            const parsed = parseHttpUrl(url);
            const parameters = parsed.search.slice(1).split('&');
            const kept = parameters.filter(parameter => {
                const name = new URLSearchParams(parameter).keys().next().value || '';
                const lowerName = name.toLowerCase();
                return !TRACKING_PARAMS.has(lowerName) && !lowerName.startsWith('utm_');
            });

            if (kept.length === parameters.length) {
                return null;
            }

            // Preserve the encoding and order of parameters that the destination may need.
            parsed.search = kept.length ? `?${kept.join('&')}` : '';
            return parsed.href;
        }

        function stripAllParams(url) {
            const parsed = parseHttpUrl(url);
            parsed.search = '';
            return parsed.href;
        }

        function createUrlBox(url, label, className = '') {
            const box = document.createElement('div');
            box.className = `url-box ${className}`;
            const heading = document.createElement('div');
            heading.className = 'url-label';
            const title = document.createElement('span');
            title.textContent = label;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'copy-button';
            button.textContent = 'Copy';
            button.setAttribute('aria-label', `Copy ${label.toLowerCase()}`);
            button.addEventListener('click', () => copyUrl(url, button));
            heading.append(title, button);
            const link = document.createElement('a');
            link.href = parseHttpUrl(url).href;
            link.textContent = url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            box.append(heading, link);
            return box;
        }

        function createUrlBoxes(url) {
            const boxes = document.createDocumentFragment();
            const normalizedUrl = parseHttpUrl(url).href;
            const cleanedUrl = cleanUrl(url);
            const strippedUrl = stripAllParams(url);

            if (cleanedUrl && cleanedUrl !== normalizedUrl) {
                boxes.append(createUrlBox(cleanedUrl, 'Without known tracking parameters', 'cleaned-url'));
            }
            if (strippedUrl !== normalizedUrl && strippedUrl !== cleanedUrl) {
                const box = createUrlBox(strippedUrl, 'Without query parameters');
                const note = document.createElement('p');
                note.className = 'hint';
                note.textContent = 'This version can change or break the destination. It keeps the URL fragment.';
                box.append(note);
                boxes.append(box);
            }
            return boxes;
        }

        async function copyUrl(url, button) {
            button.disabled = true;
            try {
                await navigator.clipboard.writeText(url);
                button.textContent = 'Copied!';
                statusMessage.textContent = 'URL copied.';
            } catch {
                button.textContent = 'Copy failed';
                statusMessage.textContent = 'Cannot copy the URL. Select the link text and copy it manually.';
            }
            setTimeout(() => {
                button.textContent = 'Copy';
                button.disabled = false;
            }, 2000);
        }

        function resetSeconds(value, now = Date.now()) {
            if (value === null || value === undefined || String(value).trim() === '') {
                return null;
            }
            const reset = Number(value);
            if (!Number.isFinite(reset) || reset < 0) {
                return null;
            }
            if (reset > 1e12) {
                return Math.max(0, Math.ceil((reset - now) / 1000));
            }
            if (reset > 1e9) {
                return Math.max(0, Math.ceil(reset - now / 1000));
            }
            return Math.ceil(reset);
        }

        function retryAfterSeconds(value, now = Date.now()) {
            if (value === null || String(value).trim() === '') {
                return null;
            }
            const seconds = Number(value);
            if (Number.isFinite(seconds)) {
                return seconds >= 0 ? Math.ceil(seconds) : null;
            }
            const date = Date.parse(value);
            return Number.isFinite(date) ? Math.max(0, Math.ceil((date - now) / 1000)) : null;
        }

        function updateRateLimitInfo(response) {
            clearInterval(countdownInterval);
            resetTimer.hidden = true;
            rateLimitInfo.classList.remove('warning', 'error');
            const remainingHeader = response.headers.get('X-RateLimit-Remaining');
            const remaining = remainingHeader === null || remainingHeader.trim() === '' ? NaN : Number(remainingHeader);
            const limit = Number(response.headers.get('X-RateLimit-Limit'));
            rateLimitInfo.hidden = !Number.isFinite(remaining) || remaining < 0;
            if (rateLimitInfo.hidden) {
                return;
            }
            requestsRemaining.textContent = String(remaining);
            if (limit > 0 && remaining < limit * 0.25) {
                rateLimitInfo.classList.add('warning');
            }
            if (remaining === 0) {
                rateLimitInfo.classList.add('error');
                const seconds = resetSeconds(response.headers.get('X-RateLimit-Reset'));
                if (seconds !== null) {
                    startResetCountdown(seconds);
                }
            }
        }

        function startResetCountdown(seconds) {
            clearInterval(countdownInterval);
            const resetAt = Date.now() + seconds * 1000;
            const update = () => {
                const secondsLeft = Math.max(0, Math.ceil((resetAt - Date.now()) / 1000));
                countdown.textContent = String(secondsLeft);
                resetTimer.hidden = secondsLeft === 0;
                if (secondsLeft === 0) {
                    clearInterval(countdownInterval);
                    rateLimitInfo.classList.remove('warning', 'error');
                    requestsRemaining.textContent = '-';
                }
            };
            countdownInterval = setInterval(update, 1000);
            update();
        }

        async function resolveUrl(url, signal) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                mode: 'cors',
                credentials: 'omit',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url }),
                signal
            });
            updateRateLimitInfo(response);

            let data;
            try {
                data = await response.json();
            } catch (error) {
                if (signal?.aborted) {
                    throw error;
                }
                // A proxy can return an HTML error page instead of the worker's JSON response.
            }

            if (response.status === 429) {
                const seconds = resetSeconds(data?.resetIn)
                    ?? retryAfterSeconds(response.headers.get('Retry-After'))
                    ?? resetSeconds(response.headers.get('X-RateLimit-Reset'));
                if (seconds !== null) {
                    rateLimitInfo.hidden = false;
                    rateLimitInfo.classList.add('error');
                    requestsRemaining.textContent = '0';
                    startResetCountdown(seconds);
                }
                throw new Error(seconds === null
                    ? 'Rate limit exceeded. Try again later.'
                    : `Rate limit exceeded. Try again in ${seconds} seconds.`);
            }
            if (!response.ok || data?.error) {
                throw new Error(typeof data?.error === 'string' && data.error
                    ? data.error
                    : `The resolver request failed (HTTP ${response.status}).`);
            }
            if (!data || !Array.isArray(data.redirectChain) || data.redirectChain.length === 0) {
                throw new Error('The resolver returned an invalid redirect chain.');
            }
            try {
                data.redirectChain.forEach(parseHttpUrl);
            } catch {
                throw new Error('The resolver returned an invalid URL in the redirect chain.');
            }
            return data;
        }

        function showError(message) {
            const error = document.createElement('div');
            error.className = 'error';
            error.setAttribute('role', 'alert');
            error.textContent = message;
            result.replaceChildren(error);
        }

        function renderResults(chain) {
            const finalUrl = chain[chain.length - 1];
            result.append(createUrlBox(finalUrl, 'Final destination', 'destination'), createUrlBoxes(finalUrl));
            const items = document.createDocumentFragment();
            for (const url of chain) {
                const item = document.createElement('li');
                const link = document.createElement('a');
                link.href = parseHttpUrl(url).href;
                link.textContent = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                item.append(link, createUrlBoxes(url));
                items.append(item);
            }
            redirectChain.replaceChildren(items);
            chainSection.hidden = false;
            const redirects = chain.length - 1;
            statusMessage.textContent = redirects === 0
                ? 'No HTTP redirects. The URL is already the final destination.'
                : `Resolved ${redirects} redirect${redirects === 1 ? '' : 's'}.`;
        }

        async function handleResolve(event) {
            event.preventDefault();
            if (activeController) {
                return;
            }
            result.replaceChildren();
            redirectChain.replaceChildren();
            chainSection.hidden = true;
            statusMessage.textContent = '';
            urlInput.removeAttribute('aria-invalid');
            const url = urlInput.value.trim();
            try {
                parseHttpUrl(url);
            } catch {
                showError(url ? 'Enter a valid URL that starts with http:// or https://.' : 'Enter a URL.');
                urlInput.setAttribute('aria-invalid', 'true');
                urlInput.focus();
                return;
            }

            const controller = new AbortController();
            activeController = controller;
            let timedOut = false;
            const timeout = setTimeout(() => {
                timedOut = true;
                controller.abort();
            }, REQUEST_TIMEOUT_MS);
            resolveButton.disabled = true;
            urlInput.disabled = true;
            cancelButton.hidden = false;
            statusMessage.textContent = 'Resolving URL…';

            try {
                const data = await resolveUrl(url, controller.signal);
                controller.signal.throwIfAborted();
                renderResults(data.redirectChain);
            } catch (error) {
                if (timedOut) {
                    statusMessage.textContent = '';
                    showError('The resolver did not respond within 20 seconds. Try again.');
                } else if (controller.signal.aborted) {
                    statusMessage.textContent = 'Request cancelled.';
                } else {
                    statusMessage.textContent = '';
                    showError(error instanceof TypeError
                        ? 'Cannot connect to the resolver. Check your connection and try again.'
                        : error.message);
                }
            } finally {
                clearTimeout(timeout);
                activeController = null;
                resolveButton.disabled = false;
                urlInput.disabled = false;
                cancelButton.hidden = true;
                urlInput.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            urlInput = document.getElementById('urlInput');
            resolveButton = document.getElementById('resolveButton');
            cancelButton = document.getElementById('cancelButton');
            result = document.getElementById('result');
            statusMessage = document.getElementById('status');
            redirectChain = document.getElementById('redirectChain');
            chainSection = document.getElementById('chainSection');
            rateLimitInfo = document.getElementById('rateLimitInfo');
            requestsRemaining = document.getElementById('requestsRemaining');
            resetTimer = document.getElementById('resetTimer');
            countdown = document.querySelector('.countdown');

            document.getElementById('resolveForm').addEventListener('submit', handleResolve);
            cancelButton.addEventListener('click', () => activeController?.abort());
        });
    </script>
</body>
</html>
